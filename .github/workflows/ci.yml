name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 全量验收（类型 / 单测 / 属性测试 / 构建 / E2E）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium 与系统依赖
        run: npx playwright install --with-deps chromium

      - name: 运行全量验收闸门
        run: npm run verify
