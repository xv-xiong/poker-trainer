name: 功能建议
description: 建议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这是一个单人扑克**练习工具**。请优先考虑「能否提高训练价值」，
        并给出可执行的验收标准——「提升用户体验」这类描述无法被验收。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 当前缺什么，导致什么练习目标无法达成
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为或界面
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样算做好了？请给出可自动或人工验证的判据
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
