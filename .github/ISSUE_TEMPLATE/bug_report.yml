name: Bug 报告
description: 报告一个缺陷或不符合预期的行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：
        - [ ] 我已搜索过现有 Issue，确认不是重复报告
        - [ ] 我已在最新版本上复现
        - [ ] 我已阅读 README 的「不支持项」，确认这不是已知限制

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 简要描述实际行为
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何稳定复现，越具体越好
      placeholder: |
        1. 打开页面
        2. 创建 6 人桌、中等难度
        3. ...
    validations:
      required: true
  - type: textarea
    id: hand
    attributes:
      label: 涉及的手牌（如有）
      description: |
        若涉及结算或牌型问题，请提供手牌编号（形如 `hand-1 (种子 28673598575, ...)`）。
        结算面板下方会显示，种子可让问题被精确复现。
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      description: 浏览器与版本、操作系统
      placeholder: "Chrome 151.0.7922.34 / Windows 11"
    validations:
      required: false
